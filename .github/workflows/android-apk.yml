# Builds the Android APK on GitHub — every push to main (or by hand: Actions › Build Android APK › Run workflow).
# The APK is attached to the run (Artifacts) and to the "APK (latest)" release, so it can be downloaded on the phone.
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the game into www/ and sync it into the Android project
        run: |
          npm run build:web
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AdventureNgani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AdventureNgani-apk
          path: AdventureNgani.apk

      - name: Put it on the "APK (latest)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (latest)
          prerelease: true
          files: AdventureNgani.apk
